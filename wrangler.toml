# Cấu hình Cloudflare Worker cho Agent Ops Board.
#
# TRƯỚC KHI DEPLOY, sửa 4 chỗ có dấu <...> bên dưới: name, database_id, kv id, bucket_name.
# Xem README mục "Dựng board của riêng bạn" để biết lệnh tạo từng thứ.

name = "<ten-worker-cua-ban>"          # -> https://<ten-worker-cua-ban>.<subdomain>.workers.dev
main = "src/index.js"
compatibility_date = "2026-01-15"
workers_dev = true

# UI được build thành 1 file HTML duy nhất (build.js) rồi nhúng vào Worker dưới dạng text.
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = false

# File nào nằm trong public/ được phục vụ thẳng theo đường dẫn của nó (public/favicon.svg ->
# /favicon.svg), trình duyệt cache lại nên KHÔNG tốn payload mỗi lượt poll. Đây cũng là chỗ để
# ảnh avatar agent nếu bạn muốn dùng ảnh thay emoji: bỏ file vào public/avatars/ rồi đặt cột
# `icon` của agent thành "/avatars/ten-file.png". Cố ý không nhét ảnh vào cột icon dạng base64:
# vài avatar ~24 KB sẽ đi kèm MỌI lần gọi /api/board (mỗi 15 giây), nặng hơn cả toàn bộ board.
# Đường nào không khớp file trong public/ thì rơi xuống Worker như cũ — /api/*, /login, / vẫn nguyên.
[assets]
directory = "./public"

[vars]
# Tên board, hiện trên tab trình duyệt và trang đăng nhập.
BOARD_TITLE = "Agent Ops Board"

# CHỈ ĐỂ DỰNG LINK, board không gọi Jira. Khai thì mã issue trong message ("ABC-1234") và ô
# "Jira key" trên card thành link bấm được; bỏ trống thì để nguyên chữ.
# JIRA_BASE_URL = "https://ten-cong-ty.atlassian.net"

# Cũng chỉ để dựng link: agent hay nhắc tới file trong repo giữa message ("outputs/abc.md").
# Khai cả hai biến thì board biến chúng thành link; bỏ trống thì để nguyên chữ.
# REPO_BASE_URL = "https://github.com/<user>/<repo>/blob/main"
# REPO_LINK_DIRS = "outputs,docs,notes"

[[d1_databases]]
binding = "DB"
database_name = "agent-ops-board"
database_id = "<id-tra-ve-boi-wrangler-d1-create>"

# Đếm số lần đăng nhập sai theo IP, để khoá tạm khi có người dò mã.
[[kv_namespaces]]
binding = "LOGIN_GUARD"
id = "<id-tra-ve-boi-wrangler-kv-namespace-create>"

# File đính kèm trong comment/message (ảnh, PDF...). Bucket riêng, không chung với public/ vì
# đây là nội dung người dùng tự tải lên, không phải asset tĩnh của repo. Phục vụ qua
# GET /api/attachments/:key, sau cùng cửa xác thực với mọi API khác — KHÔNG public, vì có thể
# chứa ảnh chụp nội bộ nhạy cảm.
[[r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "<ten-bucket-r2>"

# Secrets — cả ba đều BẮT BUỘC, set bằng `wrangler secret put <TÊN>`, không để trong file này:
#   BOARD_PASSCODE   — mã bạn gõ để đăng nhập giao diện web
#   SESSION_SECRET   — khoá HMAC ký cookie phiên đăng nhập
#   API_TOKEN        — bearer token cho agent gọi /api/*
